<!DOCTYPE html>
<html>
<head>
    <title>Nested Table</title>
</head>
<body>

<h2>Nested Table Example</h2>

<table border="1" cellpadding="10">
    <tr>
        <th>Student</th>
        <th>Details</th>
    </tr>

    <tr>
        <td>John</td>

        <!-- Nested Table Starts -->
        <td>
            <table border="1" cellpadding="8">
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                </tr>
                <tr>
                    <td>Maths</td>
                    <td>90</td>
                </tr>
                <tr>
                    <td>Science</td>
                    <td>85</td>
                </tr>
            </table>
        </td>
        <!-- Nested Table Ends -->

    </tr>

</table>

</body>
</html>
